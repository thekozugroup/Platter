[workspace]
resolver = "2"
members = [
    "crates/platter-core",
    "crates/platter-db",
    "crates/platter-runtime",
    "crates/platter-net",
    "crates/platter-games",
    "crates/platter-mods",
    "crates/platter-api",
    "crates/platter-mcp",
    "crates/platter-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/thekozugroup/Platter"
authors = ["The Kozu Group"]

[workspace.dependencies]
# Internal
platter-core = { path = "crates/platter-core" }
platter-db = { path = "crates/platter-db" }
platter-runtime = { path = "crates/platter-runtime" }
platter-net = { path = "crates/platter-net" }
platter-games = { path = "crates/platter-games" }
platter-mods = { path = "crates/platter-mods" }
platter-api = { path = "crates/platter-api" }
platter-mcp = { path = "crates/platter-mcp" }

# Async runtime and HTTP
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = [
    "fs",
    "trace",
    "compression-gzip",
    "cors",
    "set-header",
    "limit",
    "catch-panic",
    "request-id",
] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# Data
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

# Container runtime
bollard = "0.18"

# Types shared with the web client. ts-rs generates the TypeScript definitions from
# these same structs, so the wire format has exactly one source of truth.
ts-rs = { version = "10", features = ["chrono-impl", "serde-json-impl", "no-serde-warnings"] }

# Security
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# Networking
mdns-sd = "0.13"
igd-next = { version = "0.16", features = ["aio_tokio"] }

# Observability and errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
dashmap = "6"
parking_lot = "0.12"
regex = "1"
once_cell = "1"
itertools = "0.14"
humantime = "2"
cron = "0.13"
governor = "0.7"
tar = "0.4"
flate2 = "1"
walkdir = "2"
mime_guess = "2"
url = "2"
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }

# Testing
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
pretty_assertions = "1"

[profile.release]
# A control panel is a long-lived daemon: build time is paid once, runtime is paid
# forever. Full LTO and a single codegen unit are worth the slower CI build.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# Debug builds of a workspace this size are otherwise painfully slow to link.
opt-level = 0
debug = 1

[profile.dev.package."*"]
# Dependencies rarely need debugging but are compiled constantly; optimising them
# makes the dev loop dramatically faster at no real cost.
opt-level = 2
