[package]
name = "platter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared domain types, errors and traits for Platter — the contract every other Platter crate compiles against."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
# `uuid-impl` makes ts-rs render Minecraft player UUIDs as `string` instead of failing to
# resolve a TS binding for them. Additive, so it cannot break a sibling crate.
ts-rs = { workspace = true, features = ["uuid-impl"] }
sqlx = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
cron = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
