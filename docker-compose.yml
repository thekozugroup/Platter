# The whole deployment. `docker compose up -d` and Platter is running.
#
# Defaults are SQLite on a host directory — no external database to operate. A Postgres
# service is included but commented out, because most self-hosters running a handful of
# game servers do not need it, and an unnecessary database is an unnecessary outage.
#
# PLATTER_DATA_DIR is mounted at *the same absolute path* inside the container, and that is
# load-bearing rather than tidy. Platter asks the host's Docker daemon to bind-mount each
# game server's directory, and the daemon resolves bind sources on the host — so a path that
# exists only inside Platter names a different directory to the daemon than it does to
# Platter. With a named volume that is exactly what happened: Platter wrote mods, configs and
# backups into its volume while the game server read an empty directory the daemon invented
# at the host root. Mounting one host directory at its own path makes the two views the same
# bytes by construction, and Platter verifies it at boot rather than trusting it.

services:
  platter:
    image: ghcr.io/thekozugroup/platter:latest
    # Both keys on purpose. `docker compose up -d` from a clone builds this image when it
    # is not already present, so the repository is deployable before anything is
    # published; once a release exists, `docker compose pull` fetches it instead of
    # rebuilding. Removing `build` would make a fresh clone fail on a missing image.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platter
    restart: unless-stopped
    ports:
      - '${PLATTER_PORT:-8080}:8080'
    environment:
      # Required. Generate with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      # The address players connect to. Wrong value here means every server shows an
      # address nobody can reach, so it is worth setting deliberately.
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      PORT_RANGE_START: ${PORT_RANGE_START:-25000}
      PORT_RANGE_END: ${PORT_RANGE_END:-25999}
      # Optional — AI features degrade gracefully to hidden when unset.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Closed by default. The very first account is created regardless of this, so a new
      # instance is claimable without ever opening registration.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      # All three derive from the one directory above, so they cannot drift apart.
      DATA_DIR: ${PLATTER_DATA_DIR}
      BACKUP_DIR: ${PLATTER_DATA_DIR}/backups
      DATABASE_URL: ${DATABASE_URL:-file:${PLATTER_DATA_DIR}/platter.db}
      # DATABASE_URL: postgresql://platter:platter@postgres:5432/platter
    volumes:
      # Same path both sides. See the note at the top of this file before changing it.
      - ${PLATTER_DATA_DIR:?set PLATTER_DATA_DIR in .env — see .env.example}:${PLATTER_DATA_DIR}
      # Platter manages game servers as sibling containers on the host's Docker daemon.
      # This is real privilege: anything that can write to this socket can start a
      # container that mounts the host filesystem, so it is equivalent to root on the
      # host. Do not expose an instance with this mount to the internet without a trusted
      # front door, and prefer a rootless daemon or a socket proxy (docker-socket-proxy,
      # scoped to containers/images) for anything multi-tenant.
      - /var/run/docker.sock:/var/run/docker.sock
    # The container runs as an unprivileged user, so it needs the host group that owns
    # the socket. Find it with: stat -c '%g' /var/run/docker.sock
    group_add:
      - ${DOCKER_GID:-999}
    # Game servers publish their own ports on the host directly, so Platter needs no
    # special networking beyond its own.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/v1/system/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Uncomment for Postgres. Also set DATABASE_URL on the platter service above.
  # postgres:
  #   image: postgres:17-alpine
  #   container_name: platter-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: platter
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #     POSTGRES_DB: platter
  #   volumes:
  #     - platter-postgres:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U platter']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# No named volume for Platter's data: it lives in PLATTER_DATA_DIR on the host so that the
# Docker daemon and Platter agree on what every path means.
# platter-postgres:
