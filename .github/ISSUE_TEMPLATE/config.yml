# `false` keeps the "Open a blank issue" escape hatch. Some reports genuinely do not fit
# either form, and forcing them into one produces a worse report, not a better-filed one.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/thekozugroup/Platter/security/advisories/new
    about: Report privately through a GitHub security advisory. Never in a public issue — Platter holds a Docker socket, which is root on the host.

  - name: Question or setup help
    url: https://github.com/thekozugroup/Platter/discussions
    about: '"How do I…" and "is this supposed to…" belong in Discussions, where other operators can find the answer later.'

  - name: Deployment and configuration
    url: https://github.com/thekozugroup/Platter/blob/main/docs/DEPLOYMENT.md
    about: Ports, reverse proxies, TLS, Postgres, backups and rootless Docker are covered here first.

  - name: Adding a game
    url: https://github.com/thekozugroup/Platter/blob/main/CONTRIBUTING.md#adding-a-game-blueprint
    about: A new game is a blueprint — data, not code. This walks through writing one.
