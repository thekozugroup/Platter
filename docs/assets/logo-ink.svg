<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="#111111" role="img" aria-label="Platter">
  <!--
    Platter's mark with the ink fixed rather than inherited. `logo.svg` is the master and uses
    `fill="currentColor"`; that is right inside the product, where the mark is inlined as SVG and
    takes the colour of the text beside it, but wrong in a README. GitHub renders a README image
    through an <img>, and currentColor inside an <img> resolves against the SVG's own default —
    black — so the master disappears against a dark README. This pair is selected by a <picture>
    element instead. Keep all three in step; the path is identical in each.
  -->
  <path d="M6 2h8v2H6zM4 4h12v2H4zM2 6h16v8H2zM4 14h12v2H4zM6 16h8v2H6zM16 16h2v2h-2zM18 18h2v2h-2zM20 20h2v2h-2z"/>
</svg>
